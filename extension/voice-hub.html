<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VoiceScroll Hub</title>
  <style>
    /* Tesla-inspired control screen — true black, hairline borders, red accent. */
    :root {
      --bg: #050505;
      --panel: #0e1013;
      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.16);
      --text: #f4f4f2;
      --muted: rgba(244,244,242,.52);
      --faint: rgba(244,244,242,.34);
      --red: #e31937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.05), transparent 60%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      font-size: 10px; font-weight: 700; letter-spacing: .34em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 18px; user-select: none;
    }
    .brand b { color: var(--red); font-weight: 700; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 22px 26px; display: flex; align-items: center; gap: 15px;
      min-width: 340px; max-width: 86vw;
      box-shadow: 0 30px 80px -30px rgba(0,0,0,.8);
      position: relative; overflow: hidden;
    }
    .card:before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
    }
    .orb {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; background: var(--panel); border: 1px solid var(--line-strong);
      position: relative;
    }
    .orb:after {
      content: ""; position: absolute; inset: -5px; border-radius: 50%;
      border: 1px solid rgba(227,25,55,.35);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .8; }
      50% { transform: scale(1.14); opacity: .25; }
    }
    .meta { min-width: 0; }
    .state { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
    .sub {
      font-size: 11px; color: var(--muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 60vw;
    }
    .foot {
      margin-top: 18px; font-size: 9px; font-weight: 600;
      letter-spacing: .26em; text-transform: uppercase; color: var(--faint);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="brand">VOICESCROLL <b>HUB</b></div>
  <div class="card">
    <div class="orb" id="orb">🎤</div>
    <div class="meta">
      <div class="state" id="state">VoiceScroll hub starting…</div>
      <div class="sub" id="sub">listening for voice commands — keep this open</div>
    </div>
  </div>
  <div class="foot">PDF MODE · SCROLLING DRIVEN FROM THE BROWSER'S TRUSTED INPUT ENGINE</div>
  <script src="vs-core.js"></script>
  <script src="voice-hub.js"></script>
</body>
</html>
